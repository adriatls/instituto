      <div>
        <h3 class="font-semibold">Instituto Pescador Abdon Gomes da Silva</h3>
        <a
          href="https://api.whatsapp.com/send?phone=5585981834500&text=Ol%C3%A1%2C%20gostaria%20de%20saber%20mais%20sobre%20o%20Instituto%20Pescador%20Abdon%20Gomes%20da%20Silva."
          target="_blank"
          >{{ "+55 (85) 98183-4500" }}</a
        >
      </div>
    </div>

    <div class="flex items-center gap-2">
      <i
        class="pi pi-envelope"
        style="font-size: 2rem; color: var(--dark-blue)"
      ></i>
      <div>
        <h3 class="font-semibold">Instituto Pescador Abdon Gomes da Silva</h3>

      </div>
    </div>

    <div class="flex items-center gap-2">
      <i
        class="pi pi-envelope"

      ></i>

      </div>

  </div>

  @if(contactForm) {
  <form [formGroup]="contactForm" class="flex flex-col gap-3 w-full md:w-auto">
    <p>Envie uma mensagem</p>
    <p-floatlabel variant="on">
      <input
        id="name"
        pInputText
        formControlName="name"
        required
        class="w-full"
      />
      <label for="name">Nome *</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <input
        id="email"
        pInputText
        formControlName="email"
        required
        class="w-full"
      />
      <label for="email">Email *</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <textarea
        pTextarea
        id="message"
        formControlName="message"
        rows="5"
        cols="40"
        style="resize: none"
        class="w-full"
      ></textarea>
      <label for="message">Mensagem *</label>
    </p-floatlabel>

    <p-button
      label="Enviar"
      [disabled]="contactForm.invalid"
      [loading]="lodingSentMessage"
      (onClick)="sentMessage()"
    />
  </form>
  }
</div>
