<p-carousel
  [value]="partnerImages"
  [numVisible]="3"
  [numScroll]="1"
  [responsiveOptions]="responsiveOptions"
  [circular]="true"
  autoplayInterval="3000"
>
  <ng-template let-partner #item>
    <div
      class="flex justify-center align-center rounded m-2 p-4"
      style="height: 184px"
    >
      <img
        [src]="partner.src"
        [alt]="partner.alt"
        style="max-height: 150px; width: auto; border-radius: 8px"
      />
    </div>
  </ng-template>
</p-carousel>
